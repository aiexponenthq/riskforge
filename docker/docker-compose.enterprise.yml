# RiskForge Enterprise Deployment — Docker Compose Override
# Adds PostgreSQL backend and persistent blob storage
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.enterprise.yml up
#
# Required additional environment variables:
#   RISKFORGE_DATABASE_URL — PostgreSQL connection string
#   RISKFORGE_SECRET_KEY

version: "3.9"

services:
  api:
    environment:
      RISKFORGE_STORAGE_BACKEND: "postgresql"
      RISKFORGE_DATABASE_URL: "${RISKFORGE_DATABASE_URL:?RISKFORGE_DATABASE_URL is required}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: riskforge-db
    environment:
      POSTGRES_DB: riskforge
      POSTGRES_USER: "${POSTGRES_USER:-riskforge}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riskforge} -d riskforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
