# RiskForge Docker Compose for the EXPERIMENTAL API server.
#
# WARNING: `riskforge serve` is experimental and is not security-hardened.
# Run it only on a trusted, local network. RiskForge is primarily a CLI; the
# server is an optional convenience for local access over the same file-based
# store (FileStore), which is the only storage backend that ships.
#
# Usage:
#   docker compose up                  # start the API server
#   docker compose exec api riskforge --help
#
# Required environment variables (set in .env or export before running):
#   RISKFORGE_SECRET_KEY  (generate with: python -c "import secrets; print(secrets.token_hex(32))")

version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: aiexponent/riskforge:latest
    container_name: riskforge-api
    ports:
      - "8090:8090"
    volumes:
      - riskforge-data:/data
    environment:
      RISKFORGE_SECRET_KEY: "${RISKFORGE_SECRET_KEY:?RISKFORGE_SECRET_KEY is required}"
      RISKFORGE_PROJECT_DIR: "/data"
      RISKFORGE_STORAGE_BACKEND: "filesystem"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  riskforge-data:
    driver: local
