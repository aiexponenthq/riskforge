name: Release to PyPI

on:
  push:
    tags: ["v*.*.*"]

permissions:
  id-token: write    # PyPI OIDC trusted publishing (includes Sigstore provenance)
  contents: write    # GitHub Release creation
  attestations: write

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    environment: pypi-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install hatch pip-audit bandit

      - name: Security gates
        run: |
          pip install -e ".[dev]"
          bandit -ll -r src/ --exit-zero
          pip-audit --strict || true

      - name: Run full test suite
        run: pytest --cov --cov-fail-under=80

      - name: Build wheel + sdist
        run: hatch build

      - name: List built artifacts
        run: ls -lh dist/

      - name: Generate CycloneDX SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment -o sbom.cdx.json --format json

      - name: Attest build provenance (GitHub + Sigstore)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Publish to PyPI (OIDC trusted publisher)
        uses: pypa/gh-action-pypi-publish@v1.12.4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            sbom.cdx.json
