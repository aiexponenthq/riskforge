[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "riskforge"
version = "0.1.4"
description = "EU AI Act Article 9 Risk Management System — open-source CLI"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{name = "AiExponent LLC", email = "hello@aiexponent.com"}]
keywords = ["eu-ai-act", "article-9", "risk-management", "compliance", "ai-governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer[all]==0.12.3",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "pyyaml==6.0.1",
    "jsonschema==4.22.0",
    "weasyprint==62.3",
    "jinja2==3.1.4",
    "rich==13.7.1",
    "questionary==2.0.1",
    "keyring==25.2.1",
    "python-dotenv==1.0.1",
    "packaging>=24.0",
]

[project.urls]
Homepage      = "https://github.com/aiexponenthq/riskforge"
Repository    = "https://github.com/aiexponenthq/riskforge.git"
Documentation = "https://github.com/aiexponenthq/riskforge#readme"
Issues        = "https://github.com/aiexponenthq/riskforge/issues"
Changelog     = "https://github.com/aiexponenthq/riskforge/releases"

[project.optional-dependencies]
server = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "prometheus-client==0.20.0",
    "structlog==24.1.0",
    "slowapi==0.1.9",
]
dev = ["riskforge[server,test]", "pre-commit==3.7.1", "hatch==1.9.4", "pip-audit==2.7.3"]
test = [
    "pytest==8.2.0",
    "pytest-cov==5.0.0",
    "pytest-socket==0.7.0",
    "pytest-asyncio==0.23.6",
    "httpx==0.27.0",
    "bandit==1.7.8",
]

[project.scripts]
riskforge = "riskforge.cli.main:app"

[project.entry-points."riskforge.question_banks"]
health_safety      = "riskforge.plugins.builtin:HealthSafetyBank"
fundamental_rights = "riskforge.plugins.builtin:FundamentalRightsBank"
discrimination     = "riskforge.plugins.builtin:DiscriminationBank"
privacy            = "riskforge.plugins.builtin:PrivacyBank"
transparency       = "riskforge.plugins.builtin:TransparencyBank"
human_oversight    = "riskforge.plugins.builtin:HumanOversightBank"
robustness         = "riskforge.plugins.builtin:RobustnessBank"
data_governance    = "riskforge.plugins.builtin:DataGovernanceBank"

[project.entry-points."riskforge.exporters"]
json     = "riskforge.exporters.json_exporter:JSONExporter"
pdf      = "riskforge.exporters.pdf.pdf_exporter:PDFExporter"
markdown = "riskforge.exporters.markdown_exporter:MarkdownExporter"

[project.entry-points."riskforge.adapters"]
rag-benchmarking = "riskforge.adapters.rag_benchmarking:RAGBenchmarkingAdapter"
traceforge        = "riskforge.adapters.traceforge:TraceForgeAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/riskforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "S101",   # assert in tests
    "B008",   # typer.Option/Argument in function defaults — required by Typer
    "B904",   # raise-without-from-inside-except — many CLI handlers intentionally reraise
    "UP042",  # str+Enum inheritance — intentional for JSON/YAML string serialisation
    "E501",   # line too long — handled by formatter; some long strings are unavoidable
]

[tool.ruff.lint.per-file-ignores]
# Typer 0.12.3 requires Optional[X] — str | None (types.UnionType) raises RuntimeError.
# UP007 suppresses Optional[X]→X|None in ruff <0.15 (CI uses ruff 0.4.4).
# ruff 0.15+ renamed this to UP045; UP045 is intentionally absent here because
# ruff 0.4.4 would fail on an unknown rule selector. Accept UP045 warnings locally.
"src/riskforge/cli/commands/*.py" = ["UP007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --disable-socket"

[tool.coverage.run]
source = ["riskforge"]
branch = true

[tool.coverage.report]
fail_under = 24
